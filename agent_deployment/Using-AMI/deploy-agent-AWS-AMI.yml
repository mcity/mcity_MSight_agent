AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Mcity MSight agent deployment -- PHASE 2 (fast launch), standalone/manual equivalent of Docker/deploy-agent-AWS-AMI.yml (kept in sync; that copy is what cloudFormationManager.py actually submits), launched via execute-aws-cf-AWS-AMI.ipynb. Assumes BakedAmiId already has everything from Full-install/deploy-agent.yml (PHASE 1) pre-installed.

Parameters:
  # IMPORTANT: still points at the pre-MSight AMI -- replace once PHASE 1 has been baked and imaged.
  BakedAmiId:
    Type: String
    Default: ami-0722d33f9d127fc05
    Description: AMI ID baked via Full-install/deploy-agent.yml (Docker/MSight_Vision/agent deps pre-installed)
  OPENAIAPIKEY:
    Type: String
    Default: sk-123456789123456789123456789 # Replace this key
    NoEcho: true
  ANTHROPICAPIKEY:
    Type: String
    Default: ''
    Description: Anthropic API key
    NoEcho: true
  GEMINIAPIKEY:
    Type: String
    Default: ''
    Description: Gemini API key
    NoEcho: true
  GROQAPIKEY:
    Type: String
    Default: ''
    Description: Groq API key
    NoEcho: true
  LSTOKEN:
    Type: String
    Default: ''
    Description: Label Studio API token
    NoEcho: true
  LSURL:
    Type: String
    Default: 'https://app.humansignal.com'
    Description: Label Studio instance URL
  CVATURL:
    Type: String
    Default: 'https://app.cvat.ai'
    Description: CVAT instance URL
  CVATACCESSTOKEN:
    Type: String
    Default: ''
    Description: CVAT access token (leave empty if using Label Studio)
    NoEcho: true
  KeyPairName:
    Type: String
    Default: mcity-msight-agent-key
    Description: The name of the new Key Pair to be created
  # Confirmed: r5 family, no GPU.
  InstanceType:
    Type: String
    Default: r5.large
  HFTOKEN:
    Type: String
    Default: hf_asdasdasduasdasdasTSDSDasfadfasdasd
    NoEcho: true

Resources:
  MyKeyPair:
    Type: 'AWS::EC2::KeyPair'
    Properties:
      KeyName: !Ref KeyPairName

  InstanceSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Enable HTTP and SSH access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5225
          ToPort: 5225
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8002
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 5151
          ToPort: 5151
          CidrIp: 0.0.0.0/0
        # MSight_Vision's web viewer (msight_docker.py's VIEWER_PORT).
        - IpProtocol: tcp
          FromPort: 9010
          ToPort: 9010
          CidrIp: 0.0.0.0/0

  WebServerInstance:
    Type: 'AWS::EC2::Instance'
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref MyKeyPair
      SecurityGroups:
        - !Ref InstanceSecurityGroup
      ImageId: !Ref BakedAmiId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 100
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # cloud-init already runs as root -- no sudo -s needed.
          set -x
          # Already installed in the AMI (PHASE 1) -- nothing to apt-get/git-clone/pip-install here.
          cd /home/ubuntu/myapp

          python3 -m venv venv
          source venv/bin/activate

          cat <<EOF > .env
          LLM_PROVIDER=openai
          OPENAI_API_KEY=${OPENAIAPIKEY}
          ANTHROPIC_API_KEY=${ANTHROPICAPIKEY}
          GEMINI_API_KEY=${GEMINIAPIKEY}
          GROQ_API_KEY=${GROQAPIKEY}
          LS_TOKEN=${LSTOKEN}
          LS_URL=${LSURL}
          CVAT_URL=${CVATURL}
          CVAT_ACCESS_TOKEN=${CVATACCESSTOKEN}
          HF_TOKEN=${HFTOKEN}
          MSIGHT_VISION_PATH=/home/ubuntu/MSight_Vision
          MSIGHT_DEMO_VIDEO_PATH=/home/ubuntu/msight_demo_video.mp4
          EOF
          chmod 600 .env

          # PYTHONPATH lets mcp_layer scripts import the config/ package from project root.
          export PYTHONPATH=/home/ubuntu/myapp

          nohup python3 session_v51.py > session_v51.log 2>&1 &

          cd mcp_layer
          nohup python3 client_chat.py --ui > client_chat.log 2>&1 &
          nohup python3 mcp_server.py > mcp_server.log 2>&1 &
          nohup python3 llm_clients.py > llm_clients.log 2>&1 &
          nohup python3 chat_server.py > chat_server.log 2>&1 &
          nohup uvicorn ingest_server:app --host 0.0.0.0 --port 8002 > ingest_server.log 2>&1

Outputs:
  PublicIP:
    Description: Instance Public IP
    Value: !GetAtt WebServerInstance.PublicIp
