# Lint + agent tests are the required checks for main (fast, no GPU, no downloads).
# Engine tests download datasets/models from Hugging Face, so they run as a separate,
# non-required job: a failure there shows up without blocking merges.

name: Tests and Docs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PDOC_ALLOW_EXEC: 1

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Lint with flake8
      run: |
        pip install flake8==7.1.1
        # Stop the build on Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude archive
        # Everything else is reported as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude archive

  agent-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Remove unnecessary files
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Exact freeze, installed like deployment does (deploy-agent.yml): --no-deps skips
        # the resolver, which rejects declared ranges the pinned set runs fine with
        # (fiftyone 1.4.1 declares sse-starlette<1; fastmcp needs 3.x).
        pip install -r requirements.txt --no-deps
    - name: Agent tests
      run: pytest -s msight_agent/tests

  engine-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Remove unnecessary files
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt --no-deps
    - name: Engine tests
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      working-directory: auto_labeling
      run: pytest -s tests --ignore tests/workflow_aws_download_test.py --ignore tests/workflow_zero_shot_od_test.py

  docs:
    needs: agent-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt --no-deps
    - name: Documentation with pdoc
      run: pdoc ./auto_labeling/*.py ./auto_labeling/workflows/*.py ./auto_labeling/config/*.py ./auto_labeling/utils/*.py -o archive/docs
    - uses: actions/upload-pages-artifact@v3
      with:
        path: archive/docs/
    # Local availability of docs (main only: a PR's docs don't belong in a docs PR)
    - name: Pull request for updated documentation
      if: github.event_name == 'push'
      uses: peter-evans/create-pull-request@v7
      with:
        base: main
        title: '[pdoc] Updated documentation'
        commit-message: Update documentation
        delete-branch: true
        labels: documentation
        add-paths: archive/docs/*

  # Deploy the artifact to GitHub pages PUBLICLY when pushes to main occur
  # https://github.com/mitmproxy/pdoc/blob/main/.github/workflows/docs.yml
  deploy:
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
